# Production VPS — utiliser explicitement (sans docker-compose.override.yml) :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d --build
#
# L'app n'expose pas de port hôte (expose: 3000 réseau interne uniquement).
# PostgreSQL et Redis : réseau Docker interne uniquement (pas de 5433 sur 0.0.0.0).
# NEXT_PUBLIC_SITE_URL doit être https://DOMAIN dans .env.docker.

services:
  app:
    volumes:
      - /var/backups/sdcreativ:/app/data/backups:ro
    environment:
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-1}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    depends_on:
      clamav:
        condition: service_started
