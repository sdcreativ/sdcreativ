# HTTP — ACME + redirection HTTPS pour la documentation KODIVA.
# Chargé automatiquement (include conf.d/*.conf). Sans certificat SSL.

server {
  listen 80;
  listen [::]:80;
  server_name doc.kodiva.sdcreativ.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://doc.kodiva.sdcreativ.com$request_uri;
  }
}
