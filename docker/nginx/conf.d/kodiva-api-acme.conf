# HTTP — ACME + redirection HTTPS pour l’API KODIVA.
# Chargé automatiquement (include conf.d/*.conf). Sans certificat SSL.

server {
  listen 80;
  listen [::]:80;
  server_name api.ai.sdcreativ.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
